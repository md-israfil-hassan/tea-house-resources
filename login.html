<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House Login Page </title>
     <!-- Google Font manrope -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
     <!-- Tailwindcss whit DaisyUI -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.22/dist/full.min.css" rel="stylesheet" type="text/css" />
     <script src="https://cdn.tailwindcss.com"></script>
         <!-- font Awsome -->
    <script src="https://kit.fontawesome.com/6c2c9a2d71.js" crossorigin="anonymous"></script>
</head>
<body class=" bg-gradient-to-r from-indigo-100 via-purple-100 to-pink-100 ...">
     
  <!--  main section -->
<main>
<section>
    <div class="hero min-h-screen">
        <div class="hero-content flex-col ">
          <div class="text-center">
            <h1 class=" text-5xl text-slate-700 lg:text-7xl font-extrabold">Login now</h1>
            <p class=" py-4 text-stone-400 text-sm lg:text-lg">
                Ice cream is available in a variety of flavors and <br>seasonal flavors with special toppings. You can also mix <br>tea and ice cream if you want,
            </p>
          </div>
          <div class="card bg-base-100 w-full max-w-xl shrink-0 shadow-xl">
            <div class="card-body rounded-lg bg-gradient-to-r from-base-200 via-purple-100 to-pink-100 ...">
              <fieldset class="fieldset">
                <label class="label">Email<i class="fa-solid fa-user"></i></label>
                <input id="login-email" type="email" class="input w-full" placeholder="Email or Number" />
                <label class="label">Password <i class="fa-solid fa-key"></i></label>
                <input id="login-password" type="password" class="input w-full" placeholder="Password @#" />
                <div class="flex justify-between">
                    <a class="link link-hover">Forgot password?</a> 
                    <input type="checkbox" checked="checked" class="w-4 h-4 mr-[3px] checkbox" />
                </div>
                <button id="login-page" class="btn btn-neutral mt-4 w-full hover:bg-slate-700">Login <i class="fa-solid fa-right-to-bracket"></i></button>
              </fieldset>
            </div>
          </div>
        </div>
      </div>
</section>
</main>

<script src="js/login.js"></script>
</body>
</html>
